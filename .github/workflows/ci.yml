name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.8"

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            gcc-riscv64-linux-gnu \
            libssl-dev \
            zlib1g-dev

          # --- arm64/armhf/riscv64 cross-compile libraries via multiarch ---
          # Ubuntu 24.04+ and Debian 13+ removed many *-cross library packages.
          # We use dpkg multiarch instead, but must add arm64/armhf/riscv64 apt sources
          # because the default Ubuntu mirror (azure.archive.ubuntu.com) does
          # not serve these non-amd64 binaries — only ports.ubuntu.com does.
          # See: https://github.com/actions/runner-images/issues/10901

          for arch in arm64 armhf riscv64; do
            if dpkg --print-foreign-architectures | grep -qx "$arch"; then
              echo "$arch architecture already added"
            else
              sudo dpkg --add-architecture "$arch"
            fi
          done

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            codename="$(lsb_release -cs)"
            sudo rm -f /etc/apt/sources.list.d/ubuntu.sources

            cat <<EOF | sudo tee /etc/apt/sources.list.d/amd64.sources
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: ${codename} ${codename}-updates ${codename}-backports
          Components: main restricted universe multiverse
          Architectures: amd64

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: ${codename}-security
          Components: main restricted universe multiverse
          Architectures: amd64
          EOF
            cat <<EOF | sudo tee /etc/apt/sources.list.d/ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: ${codename} ${codename}-updates ${codename}-backports ${codename}-security
          Components: main restricted universe multiverse
          Architectures: arm64 armhf riscv64
          EOF
          elif [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
            sudo sed -i 's/^deb-src /deb-src [arch=amd64] /' /etc/apt/sources.list
            codename="$(lsb_release -cs)"
            sudo tee -a /etc/apt/sources.list >/dev/null <<EOF
          deb [arch=arm64,armhf,riscv64] http://deb.debian.org/debian ${codename} main
          deb [arch=arm64,armhf,riscv64] http://deb.debian.org/debian ${codename}-updates main
          deb [arch=arm64,armhf,riscv64] http://security.debian.org/debian-security ${codename}-security main
          EOF
          fi

          sudo apt-get update
          sudo apt-get install -y \
            libz-dev:arm64 \
            libssl-dev:arm64 \
            libz-dev:armhf \
            libssl-dev:armhf \
            libz-dev:riscv64 \
            libssl-dev:riscv64

      - name: Build Linux Binaries
        run: |
          bash scripts/build_multiarch.sh dist
          ls -lh dist/

      - name: Download Upstream Shell Agent
        run: |
          curl -fsSL -o /tmp/hetrixtools_agent.sh \
            https://raw.githubusercontent.com/hetrixtools/agent/master/hetrixtools_agent.sh
          chmod +x /tmp/hetrixtools_agent.sh
          echo "HETRIXTOOLS_SHELL_AGENT=/tmp/hetrixtools_agent.sh" >> "$GITHUB_ENV"

      - name: Run Parity Test
        run: |
          python3 tests/parity_test.py

      - name: Run Outgoing Pings Test
        run: |
          python3 tests/oping_test.py

      - name: Run Dummy Ingest Smoke Test
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, sys, tempfile
          sys.path.insert(0, "tests")
          from server_fixture import CaptureServer

          with tempfile.TemporaryDirectory() as tmp:
              cfg = os.path.join(tmp, "hetrixtools.cfg")
              shutil.copy("hetrixtools.cfg", cfg)
              content = open(cfg).read().replace('SID=""', 'SID="0123456789abcdef0123456789abcdef"')
              open(cfg, "w").write(content)

              server = CaptureServer()
              server.start()
              try:
                  env = os.environ.copy()
                  env["HETRIXTOOLS_POST_URL"] = server.url()
                  subprocess.check_call([
                      "dist/hetrixtools_agent_linux_amd64",
                      "--once",
                      f"--config={cfg}",
                      f"--log={os.path.join(tmp, 'agent.log')}",
                  ], env=env)
              finally:
                  server.stop()

              data = server.last_payload()
              assert data is not None, "agent did not POST to capture server"
              assert data.get("SID") == "0123456789abcdef0123456789abcdef", f"SID mismatch: {data.get('SID')}"
              assert data.get("version"), "missing version"
              print("Dummy ingest smoke test passed.")
          PY
