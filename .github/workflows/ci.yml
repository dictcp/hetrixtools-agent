name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cache Nim build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nim-${{ runner.os }}-2.2.8-${{ hashFiles('hetrixtools_agent.nim') }}
          restore-keys: |
            nim-${{ runner.os }}-2.2.8-

      - name: Build Linux Binaries
        run: |
          bash scripts/build_multiarch.sh dist
          ls -lh dist/

      - name: Download Upstream Shell Agent
        run: |
          curl -fsSL -o /tmp/hetrixtools_agent.sh \
            https://raw.githubusercontent.com/hetrixtools/agent/master/hetrixtools_agent.sh
          chmod +x /tmp/hetrixtools_agent.sh
          echo "HETRIXTOOLS_SHELL_AGENT=/tmp/hetrixtools_agent.sh" >> "$GITHUB_ENV"

      - name: Run Parity Test
        run: |
          python3 tests/parity_test.py

      - name: Run Outgoing Pings Test
        run: |
          python3 tests/oping_test.py

      - name: Run Dummy Ingest Smoke Test
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, sys, tempfile
          sys.path.insert(0, "tests")
          from server_fixture import CaptureServer

          with tempfile.TemporaryDirectory() as tmp:
              cfg = os.path.join(tmp, "hetrixtools.cfg")
              shutil.copy("hetrixtools.cfg", cfg)
              content = open(cfg).read().replace('SID=""', 'SID="0123456789abcdef0123456789abcdef"')
              open(cfg, "w").write(content)

              server = CaptureServer()
              server.start()
              try:
                  env = os.environ.copy()
                  env["HETRIXTOOLS_POST_URL"] = server.url()
                  subprocess.check_call([
                      "dist/hetrixtools_agent_linux_amd64",
                      "--once",
                      f"--config={cfg}",
                      f"--log={os.path.join(tmp, 'agent.log')}",
                  ], env=env)
              finally:
                  server.stop()

              data = server.last_payload()
              assert data is not None, "agent did not POST to capture server"
              assert data.get("SID") == "0123456789abcdef0123456789abcdef", f"SID mismatch: {data.get('SID')}"
              assert data.get("version"), "missing version"
              print("Dummy ingest smoke test passed.")
          PY
