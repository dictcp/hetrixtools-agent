name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Cache Nim build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nim-${{ runner.os }}-2.2.8-${{ hashFiles('hetrixtools_agent.nim') }}
          restore-keys: |
            nim-${{ runner.os }}-2.2.8-

      - name: Build Linux Binaries
        run: |
          bash scripts/build_multiarch.sh dist
          ls -lh dist/

      - name: Run Parity Test
        run: |
          python3 tests/parity_test.py

      - name: Run ZFS Test
        run: |
          nim r --nimcache:/tmp/hetrixtools-zfs-nimcache tests/zfs_test.nim

      - name: Run Dummy Ingest Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          CFG="$WORKDIR/hetrixtools.cfg"
          LOG="$WORKDIR/hetrixtools_agent.log"
          DECODED="$WORKDIR/decoded.json"

          cp hetrixtools.cfg "$CFG"
          sed -i 's/^SID=""/SID="0123456789abcdef0123456789abcdef"/' "$CFG"

          python3 - <<'PY' "$DECODED" &
          import base64
          import gzip
          import json
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from urllib.parse import parse_qs

          out_path = sys.argv[1]

          class Handler(BaseHTTPRequestHandler):
            def do_POST(self):  # noqa: N802
              length = int(self.headers.get("Content-Length", "0"))
              raw = self.rfile.read(length).decode("utf-8", errors="replace")
              data = parse_qs(raw, keep_blank_values=True, strict_parsing=True)
              encoded = data["j"][0]
              payload = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")
              parsed = json.loads(payload)
              with open(out_path, "w", encoding="utf-8") as f:
                json.dump(parsed, f, indent=2)
                f.write("\n")
              body = b'{"ok":true}\n'
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

            def log_message(self, format, *args):  # noqa: A003
              return

          httpd = HTTPServer(("127.0.0.1", 18080), Handler)
          httpd.handle_request()
          PY
          SERVER_PID=$!

          # Generate a real payload with the built binary, then post it to dummy ingest.
          dist/hetrixtools_agent_linux_amd64 --once --no-post --config="$CFG" --log="$LOG"
          curl -fsS -X POST --data-binary @"$LOG" http://127.0.0.1:18080/v2/ >/dev/null
          wait "$SERVER_PID"

          python3 - <<'PY' "$DECODED"
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
            data = json.load(f)
          assert data.get("SID") == "0123456789abcdef0123456789abcdef"
          assert data.get("version"), "missing version"
          print("Dummy ingest smoke test passed.")
          PY

      - name: Package Binaries
        run: |
          cd dist
          tar -czf hetrixtools_agent_linux_amd64.tar.gz hetrixtools_agent_linux_amd64
          tar -czf hetrixtools_agent_linux_arm64.tar.gz hetrixtools_agent_linux_arm64
          tar -czf hetrixtools_agent_linux_armv7.tar.gz hetrixtools_agent_linux_armv7
          tar -czf hetrixtools_agent_linux_riscv64.tar.gz hetrixtools_agent_linux_riscv64
          ls -lh *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hetrixtools_agent_linux_amd64.tar.gz
            dist/hetrixtools_agent_linux_arm64.tar.gz
            dist/hetrixtools_agent_linux_armv7.tar.gz
            dist/hetrixtools_agent_linux_riscv64.tar.gz

      - name: Bump agent release version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          sed -i "s/^RELEASE_TAG=.*/RELEASE_TAG=\"$TAG\"/" \
            hetrixtools_install.sh \
            hetrixtools_update.sh
          git add \
            hetrixtools_install.sh \
            hetrixtools_update.sh
          git commit -m "chore: bump agent release to $TAG"

      - name: Bump Unraid plugin version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TODAY="$(date -u +%Y.%m.%d)"
          CURRENT="$(sed -n 's/^[[:space:]]*version="\([^"]*\)"/\1/p' unraid/hetrixtools-agent.plg | head -n 1)"

          case "$CURRENT" in
            "$TODAY")
              PLUGIN_VERSION="${TODAY}.1"
              ;;
            "$TODAY".*)
              REVISION="${CURRENT##*.}"
              case "$REVISION" in
                ''|*[!0-9]*)
                  echo "Invalid Unraid plugin revision: $CURRENT" >&2
                  exit 1
                  ;;
              esac
              PLUGIN_VERSION="${TODAY}.$((REVISION + 1))"
              ;;
            *)
              PLUGIN_VERSION="$TODAY"
              ;;
          esac

          sed -i "s/^RELEASE_TAG=.*/RELEASE_TAG=\"$TAG\"/" unraid/hetrixtools-agent.plg
          sed -i "s/\"release\": \"v[^\"]*\"/\"release\": \"$TAG\"/" unraid/plugin.json
          sed -i "0,/version=\"[^\"]*\"/s//version=\"$PLUGIN_VERSION\"/" unraid/hetrixtools-agent.plg
          sed -i "0,/^<!\\[CDATA\\[$/s||<![CDATA[\\n### $PLUGIN_VERSION\\n- Update bundled HetrixTools Agent to $TAG.\\n|" unraid/hetrixtools-agent.plg
          git add \
            unraid/hetrixtools-agent.plg \
            unraid/plugin.json
          git commit -m "chore: bump Unraid plugin to $PLUGIN_VERSION"
          git push origin master
